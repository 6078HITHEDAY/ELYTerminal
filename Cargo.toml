[package]
name = "elyterminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A terminal on GPUI and Ely."
repository = "https://git.zacharyzhang.com/ZacharyZhang-NY/ELYTerminal"
publish = false

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1"
dirs = "7"
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components.git", rev = "12512217bd9bc652ed6bbf10461b00cc26c01c21" }
env_logger = "0.11"
futures = "0.3"
gethostname = "1.1.0"
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "wayland", "x11"] }
log = "0.4"
polling = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix-openpty = "0.2"
signal-hook = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
objc = "0.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
