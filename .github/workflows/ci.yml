name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: [self-hosted, macos-arm64]
    steps:
      - uses: actions/checkout@v7
      # The runner's PATH lacks the host's rustup.
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install --no-self-update
      - run: scripts/check.sh
      - run: cargo build --locked

  windows:
    runs-on: [self-hosted, ely-windows]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - run: cargo test --locked --quiet
      - run: cargo build --locked

  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev \
            libfreetype-dev zsh fish xvfb
      - run: cargo test --locked --quiet
      - run: cargo build --locked
